# 脆弱性ゲートのポリシー。ローカル(make scan)・CI・定期再スキャンで同じ設定を使う。
# 判断の背景は docs/sbom-operations.md を参照。

# High 以上が 1 件でもあれば失敗させる
fail-on-severity: high

# 修正版が存在する脆弱性だけを対象にする。
# ベースイメージの OS パッケージには「修正予定なし(won't fix)」の指摘が常に残り、
# 自分たちでは対応できないため、ゲートの対象から外す。
only-fixed: true

# 個別に除外する脆弱性。「影響を受けない」と判断したものだけを、理由と見直し期限を添えて書く。
# 例:
# ignore:
#   # 2026-11-11 alice: 該当関数を呼び出していないため影響なし。2027-02 に再評価する
#   - vulnerability: CVE-2099-0001
#     package:
#       name: example-package
ignore: []
