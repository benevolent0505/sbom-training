# 依存関係の更新 PR を Dependabot に作らせる。
#
# cooldown: 公開から 7 日未満のバージョンは更新候補にしない(docs/dependency-policy.md)。
# cooldown が効くのは定期的な「バージョン更新」だけで、脆弱性に対する
# 「セキュリティ更新」は cooldown を待たずに PR が作られる。
version: 2

updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Node.js のメジャーバージョンは LTS の切り替えに合わせて手動で上げる
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Dockerfile のベースイメージ(タグと digest)
  - package-ecosystem: docker
    directories:
      - /api
      - /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node.js のメジャーバージョンは LTS の切り替えに合わせて手動で上げる
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # compose.yaml のイメージ
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # ワークフローで使う Action(コミット SHA で固定している)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
