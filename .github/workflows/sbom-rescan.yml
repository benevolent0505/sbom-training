# 保存してある SBOM を、最新の脆弱性データベースでスキャンし直す。
#
# ビルド時点で問題がなくても、脆弱性は後から見つかる。イメージを作り直さなくても、
# 保存してある SBOM を再スキャンすれば「いま公開しているもの」への影響が分かる。
#
# 対象は、CI ワークフローが main で保存した SBOM(artifact)のうち最新のもの。
# artifact が保持期限(90 日)切れで残っていない場合や、タグを指定した場合は、
# Release に添付された SBOM を使う。基準(.grype.yaml)を超えたら Issue を起票する。
#
# このリポジトリは継続的に保守していないため、手動実行だけにしている。
# 定期的に実行する場合は、下の schedule のコメントを外す。
name: SBOM 再スキャン

on:
  # schedule:
  #   - cron: "17 21 * * *" # 毎日 06:17 JST
  workflow_dispatch:
    inputs:
      release:
        description: "対象にする Release のタグ(例: v0.1.0)。空欄なら main の最新ビルド"
        required: false
        type: string

permissions:
  contents: read

jobs:
  rescan:
    name: 再スキャン (${{ matrix.component }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # CI ワークフローの artifact の取得
      issues: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    env:
      COMPONENT: ${{ matrix.component }}
      SBOM_NAME: sbom-training-${{ matrix.component }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # テストで失敗した実行はイメージも SBOM も作らないので、
      # SBOM の artifact を持つ実行が見つかるまで新しい順にさかのぼる。
      - name: 対象の SBOM を取得
        id: sbom
        env:
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          target=""
          if [[ -z "$RELEASE_TAG" ]]; then
            runs=$(gh run list --workflow ci.yml --branch main --event push \
              --status completed --limit 20 --json databaseId --jq '.[].databaseId')
            for run_id in $runs; do
              if gh run download "$run_id" --name "sbom-${COMPONENT}" --dir sbom 2>/dev/null; then
                target="$(cat "sbom/${SBOM_NAME}.image.txt")(main の CI 実行 ${run_id})"
                break
              fi
              rm -rf sbom
            done
          fi

          # タグの指定があるか、artifact が残っていなければ Release の SBOM を使う
          if [[ -z "$target" ]]; then
            tag="${RELEASE_TAG:-$(gh release view --json tagName --jq '.tagName')}"
            gh release download "$tag" --pattern "${SBOM_NAME}.cdx.json" --dir sbom
            target="Release ${tag} に添付された SBOM"
          fi

          echo "target=${target}" >>"$GITHUB_OUTPUT"
          echo "対象: ${target}"

      - name: Grype をインストール
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: SBOM を脆弱性スキャン
        id: scan
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          status=0
          ./scripts/sbom-scan.sh "sbom/${SBOM_NAME}.cdx.json" || status=$?
          echo "status=${status}" >>"$GITHUB_OUTPUT"
          # 2 は「基準を超える脆弱性あり」。それ以外の非ゼロはスキャン自体の失敗
          if [[ $status -ne 0 && $status -ne 2 ]]; then
            exit "$status"
          fi

      - name: スキャン結果を保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescan-${{ matrix.component }}
          path: sbom/
          if-no-files-found: warn

      # 基準を超えたらコンポーネントごとに 1 件の Issue を起票(既にあれば本文を更新)し、
      # 解消したら自動でクローズする。
      - name: Issue を起票・更新・クローズ
        env:
          STATUS: ${{ steps.scan.outputs.status }}
          TARGET: ${{ steps.sbom.outputs.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[SBOM 再スキャン] ${COMPONENT}: 基準を超える脆弱性があります"
          gh label create sbom-rescan --color B60205 \
            --description "SBOM の再スキャンで検出された脆弱性" --force
          number=$(gh issue list --state open --label sbom-rescan --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")

          if [[ "$STATUS" == "2" ]]; then
            {
              echo "保存済みの SBOM を再スキャンした結果、\`.grype.yaml\` の基準を超える脆弱性が見つかりました。"
              echo
              echo "- 対象: ${TARGET}"
              echo "- 実行結果: ${RUN_URL}"
              echo "- 最終確認: $(date -u +%Y-%m-%dT%H:%MZ)"
              echo
              echo '```'
              cat "sbom/${SBOM_NAME}.grype.txt"
              echo '```'
              echo
              echo "対応手順は [docs/sbom-operations.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/sbom-operations.md) を参照してください。"
            } >body.md
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$title" --label sbom-rescan --body-file body.md
            fi
            exit 1
          fi

          if [[ -n "$number" ]]; then
            gh issue close "$number" \
              --comment "最新の再スキャンで基準内に収まったためクローズします。${RUN_URL}"
          fi
